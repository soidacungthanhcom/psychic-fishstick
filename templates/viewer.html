<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TIVI TRỰC TIẾP - VOVINAM</title>
    <script src="/static/socket.io.js"></script>
    <style>
        body {
            background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; text-transform: uppercase; user-select: none;
        }
        
        /* THANH TIÊU ĐỀ */
        .header {
            background: #111; border-bottom: 4px solid #ffcc00; 
            display: flex; justify-content: space-between; align-items: center; height: 9vh;
        }
        .logo-box { width: 20vw; display: flex; align-items: center; justify-content: center; height: 100%; }
        .logo-box img { max-height: 7.5vh; object-fit: contain; filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.3));}
        .header h1 { margin: 0; flex: 1; text-align: center; font-size: 3.5vh; color: #ffcc00; letter-spacing: 3px; font-weight: 900;}
        
        /* BỐ CỤC CHÍNH */
        .main-content { display: flex; flex: 1; height: 91vh; }
        
        /* KHU VỰC VĐV (Bố cục ngang để nhét dàn đèn ra mép) */
        .team {
            flex: 1; display: flex; flex-direction: row; justify-content: space-between;
            padding: 2vh 1vw; padding-top: 3vh;
        }
        .team-blue { background: linear-gradient(180deg, #001f4d 0%, #000 100%); }
        .team-red { background: linear-gradient(180deg, #4d0000 0%, #000 100%); }
        
        /* KHU VỰC HIỂN THỊ CHÍNH GIỮA CỦA MỖI BÊN */
        .team-inner {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 0 1vw;
        }
        .athlete-name { font-size: 5.5vh; font-weight: 900; text-align: center; line-height: 1.1; margin-bottom: 0.5vh; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .athlete-unit { font-size: 3vh; color: #ccc; margin-bottom: 1vh; font-weight: bold;}
        
        /* ĐIỂM SỐ KHỔNG LỒ */
        .score {
            font-size: 38vh; font-weight: 900; line-height: 1; margin: 1vh 0;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .score-blue { color: #3399ff; }
        .score-red { color: #ff4d4d; }

        /* ================================================= */
        /* DÀN ĐÈN GIÁM ĐỊNH NẰM DỌC Ở 2 MÉP MÀN HÌNH */
        /* ================================================= */
        .outer-lights {
            display: flex; gap: 1vw; padding: 2vh 1vw; background: rgba(255,255,255,0.05); 
            border-radius: 1vh; border: 1px solid #333; height: 75vh; box-sizing: border-box;
        }
        .light-col { display: flex; flex-direction: column; gap: 3vh; align-items: center; justify-content: flex-start; }
        .light-title { font-size: 2.5vh; font-weight: 900; margin-bottom: 1vh; text-shadow: 0 0 10px currentColor;}
        .v-light { 
            width: 5.5vh; height: 5.5vh; background: #111; border-radius: 50%; border: 3px solid #444; 
            display: flex; align-items: center; justify-content: center; font-size: 2.5vh; 
            color: #555; font-weight: bold; transition: 0.1s;
        }
        
        /* HIỆU ỨNG MÀU SẮC ĐÈN (VÀNG = +1, XANH LAM = +2) */
        .on-yellow { 
            background: #ffcc00 !important; color: #000 !important; 
            box-shadow: 0 0 35px #ffcc00, inset 0 0 15px white; 
            border-color: white; transform: scale(1.15);
        }
        .on-cyan { 
            background: #00ffcc !important; color: #000 !important; 
            box-shadow: 0 0 35px #00ffcc, inset 0 0 15px white; 
            border-color: white; transform: scale(1.15);
        }
        
        /* CỤM ĐÈN BÁO LỖI (Nằm dưới điểm số) */
        .warnings-container { display: flex; flex-direction: column; align-items: center; margin-top: auto; padding-bottom: 2vh;}
        .warn-title { font-size: 2.2vh; color: #888; margin-bottom: 1.5vh; letter-spacing: 2px;}
        .warnings { display: flex; gap: 2vw; }
        .warn-circle { width: 4.5vh; height: 4.5vh; border-radius: 50%; border: 4px solid #444; background: #111; transition: 0.3s;}
        .warn-active { background: #ff9900; border-color: #fff; box-shadow: 0 0 25px #ff9900;}
        
        /* CỘT ĐIỀU KHIỂN TRUNG TÂM */
        .center-col {
            width: 25vw; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #0a0a0a; border-left: 3px solid #333; border-right: 3px solid #333; padding: 2vh 0; gap: 4vh;
        }
        .category-box { font-size: 3vh; color: #aaa; text-align: center; padding: 0 1vw; font-weight: bold;}
        .round-box { font-size: 6vh; color: #00ffcc; font-weight: 900; text-align: center; letter-spacing: 2px;}
        .timer-box { 
            font-size: 11vh; color: yellow; font-weight: bold; background: #111; 
            padding: 2vh 2vw; border-radius: 2vh; border: 4px solid #444; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8); line-height: 1; font-family: monospace;
        }

        /* MÀN HÌNH KẾT THÚC TRẬN */
        #winnerOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #winnerText { font-size: 15vh; font-weight: 900; color: yellow; text-shadow: 0 0 50px yellow; text-align: center; line-height: 1.2;}
        .winner-sub { font-size: 6vh; color: #fff; margin-top: 3vh;}
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Vovinam_logo.svg/200px-Vovinam_logo.svg.png" alt="Logo">
        </div>
        <h1>HỆ THỐNG ĐIỀU HÀNH GIẢI VOVINAM</h1>
        <div class="logo-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Vovinam_logo.svg/200px-Vovinam_logo.svg.png" alt="Logo">
        </div>
    </div>

    <div class="main-content">
        <!-- ================= BÊN XANH ================= -->
        <div class="team team-blue">
            <!-- ĐÈN GIÁM ĐỊNH NẰM SÁT MÉP TRÁI -->
            <div class="outer-lights">
                <div class="light-col">
                    <div class="light-title" style="color: #ffcc00;">TAY</div>
                    <div class="v-light" id="vw_l_b1_1">1</div><div class="v-light" id="vw_l_b1_2">2</div><div class="v-light" id="vw_l_b1_3">3</div><div class="v-light" id="vw_l_b1_4">4</div><div class="v-light" id="vw_l_b1_5">5</div>
                </div>
                <div class="light-col">
                    <div class="light-title" style="color: #00ffcc;">CHÂN</div>
                    <div class="v-light" id="vw_l_b2_1">1</div><div class="v-light" id="vw_l_b2_2">2</div><div class="v-light" id="vw_l_b2_3">3</div><div class="v-light" id="vw_l_b2_4">4</div><div class="v-light" id="vw_l_b2_5">5</div>
                </div>
            </div>
            
            <!-- THÔNG TIN VĐV XANH -->
            <div class="team-inner">
                <div class="athlete-name blue-text" id="nameBlue">VĐV XANH</div>
                <div class="athlete-unit" id="unitBlue">ĐƠN VỊ</div>
                <div class="score score-blue" id="scoreBlue">0</div>
                
                <div class="warnings-container">
                    <div class="warn-title">CẢNH CÁO / VI PHẠM</div>
                    <div class="warnings">
                        <div class="warn-circle" id="bw1"></div><div class="warn-circle" id="bw2"></div><div class="warn-circle" id="bw3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= TRUNG TÂM ================= -->
        <div class="center-col">
            <div class="category-box" id="category">HẠNG CÂN / NỘI DUNG</div>
            <div class="round-box" id="roundDisplay">HIỆP 1</div>
            <div class="timer-box" id="timer">02:00</div>
            
            <div style="display: flex; gap: 1vw; margin-top: 2vh; align-items: center;">
                <div style="width: 2vh; height: 2vh; background: red; border-radius: 50%; box-shadow: 0 0 10px red; animation: blink 1s infinite;"></div>
                <div style="font-size: 2vh; color: #888; font-weight: bold;">HỆ THỐNG ĐIỆN TỬ KÍCH HOẠT</div>
            </div>
        </div>

        <!-- ================= BÊN ĐỎ ================= -->
        <div class="team team-red">
            <!-- THÔNG TIN VĐV ĐỎ -->
            <div class="team-inner">
                <div class="athlete-name red-text" id="nameRed">VĐV ĐỎ</div>
                <div class="athlete-unit" id="unitRed">ĐƠN VỊ</div>
                <div class="score score-red" id="scoreRed">0</div>
                
                <div class="warnings-container">
                    <div class="warn-title">CẢNH CÁO / VI PHẠM</div>
                    <div class="warnings">
                        <div class="warn-circle" id="rw1"></div><div class="warn-circle" id="rw2"></div><div class="warn-circle" id="rw3"></div>
                    </div>
                </div>
            </div>

            <!-- ĐÈN GIÁM ĐỊNH NẰM SÁT MÉP PHẢI -->
            <div class="outer-lights">
                <div class="light-col">
                    <div class="light-title" style="color: #ffcc00;">TAY</div>
                    <div class="v-light" id="vw_l_r1_1">1</div><div class="v-light" id="vw_l_r1_2">2</div><div class="v-light" id="vw_l_r1_3">3</div><div class="v-light" id="vw_l_r1_4">4</div><div class="v-light" id="vw_l_r1_5">5</div>
                </div>
                <div class="light-col">
                    <div class="light-title" style="color: #00ffcc;">CHÂN</div>
                    <div class="v-light" id="vw_l_r2_1">1</div><div class="v-light" id="vw_l_r2_2">2</div><div class="v-light" id="vw_l_r2_3">3</div><div class="v-light" id="vw_l_r2_4">4</div><div class="v-light" id="vw_l_r2_5">5</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH KẾT THÚC TRẬN -->
    <div id="winnerOverlay" onclick="this.style.display='none'">
        <div id="winnerText">XANH THẮNG</div>
        <div class="winner-sub">CHÚC MỪNG VẬN ĐỘNG VIÊN</div>
    </div>

    <style>
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>

    <script>
        var socket = io();

        // --- CẬP NHẬT THÔNG TIN TỪ ADMIN ---
        socket.on('viewer_receive_update', function(data) {
            if(data.type === 'info') {
                document.getElementById('nameBlue').innerText = data.blueName || 'XANH';
                document.getElementById('unitBlue').innerText = data.blueUnit || '---';
                document.getElementById('nameRed').innerText = data.redName || 'ĐỎ';
                document.getElementById('unitRed').innerText = data.redUnit || '---';
                document.getElementById('roundDisplay').innerText = data.round || 'HIỆP 1';
                document.getElementById('category').innerText = data.category || 'NỘI DUNG THI ĐẤU';
                document.getElementById('winnerOverlay').style.display = 'none'; 
            }
            else if(data.type === 'score') {
                document.getElementById('scoreBlue').innerText = data.blue;
                document.getElementById('scoreRed').innerText = data.red;
            }
            else if(data.type === 'timer') {
                document.getElementById('timer').innerText = data.timeStr;
            }
            else if(data.type === 'warning') {
                for(let i=1; i<=3; i++) {
                    let w = document.getElementById('bw'+i);
                    if(i <= data.blueWarn) w.classList.add('warn-active');
                    else w.classList.remove('warn-active');
                }
                for(let i=1; i<=3; i++) {
                    let w = document.getElementById('rw'+i);
                    if(i <= data.redWarn) w.classList.add('warn-active');
                    else w.classList.remove('warn-active');
                }
            }
            else if(data.type === 'reset') {
                document.getElementById('scoreBlue').innerText = 0;
                document.getElementById('scoreRed').innerText = 0;
                document.getElementById('timer').innerText = "02:00";
                document.getElementById('winnerOverlay').style.display = 'none';
                
                for(let i=1; i<=3; i++) {
                    document.getElementById('bw'+i).classList.remove('warn-active');
                    document.getElementById('rw'+i).classList.remove('warn-active');
                }
            }
        });

        // --- THUẬT TOÁN MÀU SẮC ĐÈN (VÀNG VÀ XANH LAM) ---
        socket.on('server_send_vote', function(d) {
            let sideCode = d.side === 'blue' ? 'b' : 'r';
            let lightId = `vw_l_${sideCode}${d.points}_${d.judge_id}`;
            let light = document.getElementById(lightId);
            
            // +1 (Tay) => Màu Vàng | +2 (Chân) => Màu Xanh Lam
            let colorClass = d.points == 1 ? 'on-yellow' : 'on-cyan';
            
            if(light) { 
                light.classList.add(colorClass); 
                setTimeout(() => light.classList.remove(colorClass), 700); 
            }
        });

        // --- HƯỞNG ỨNG KHI KẾT THÚC TRẬN ---
        socket.on('viewer_finish', function(data) {
            let overlay = document.getElementById('winnerOverlay');
            let text = document.getElementById('winnerText');
            overlay.style.display = 'flex';
            
            if(data.winner === 'XANH') {
                text.innerText = "XANH CHIẾN THẮNG";
                text.style.color = "#3399ff";
                text.style.textShadow = "0 0 50px #3399ff";
            } else if(data.winner === 'ĐỎ') {
                text.innerText = "ĐỎ CHIẾN THẮNG";
                text.style.color = "#ff4d4d";
                text.style.textShadow = "0 0 50px #ff4d4d";
            } else {
                text.innerText = "KẾT QUẢ HÒA";
                text.style.color = "yellow";
                text.style.textShadow = "0 0 50px yellow";
            }
        });
    </script>
</body>
</html>
