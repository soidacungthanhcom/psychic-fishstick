<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TIVI CHẤM QUYỀN - VOVINAM</title>
    <script src="/static/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #111; border-bottom: 5px solid #00ffcc; text-align: center; padding: 2vh 0; }
        .athlete-name { font-size: 8vh; color: #ffcc00; font-weight: 900; margin: 0; letter-spacing: 2px; text-transform: uppercase;}
        .athlete-unit { font-size: 4vh; color: #ccc; font-weight: bold; margin-top: 1vh;}

        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2vh 5vw; }
        
        /* 5 Ô ĐIỂM CỦA GIÁM ĐỊNH */
        .judges-container { display: flex; gap: 3vw; justify-content: center; width: 100%; margin-bottom: 5vh; }
        .judge-box { 
            background: #1a1a1a; border: 4px solid #444; border-radius: 2vh; 
            width: 16vw; height: 28vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.5s ease;
        }
        .j-title { font-size: 3vh; color: #888; font-weight: bold; margin-bottom: 2vh; }
        .j-score { font-size: 10vh; font-weight: 900; color: white; transition: 0.5s; }

        /* HIỆU ỨNG TIVI QUYỀN */
        .dimmed { opacity: 0.2; transform: scale(0.9); border-color: #333 !important; }
        .highlighted { border-color: #00ffcc !important; box-shadow: 0 0 40px rgba(0,255,204,0.5); transform: scale(1.1); }
        .highlighted .j-score { color: #00ffcc; }

        /* TỔNG ĐIỂM (BỊ ẨN LÚC ĐẦU) */
        .total-container { opacity: 0; transform: translateY(50px); transition: all 1s ease; text-align: center; }
        .total-title { font-size: 4vh; color: #ff9900; font-weight: bold; letter-spacing: 5px; }
        .total-score { font-size: 18vh; font-weight: 900; color: yellow; text-shadow: 0 0 50px yellow; line-height: 1; }
        
        .show-total { opacity: 1; transform: translateY(0); }

        .waiting-text { font-size: 5vh; color: #555; font-style: italic; animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="athlete-name" id="tvName">ĐANG CHỜ VẬN ĐỘNG VIÊN...</h1>
        <div class="athlete-unit" id="tvUnit">---</div>
    </div>

    <div class="main-content">
        <div class="judges-container" id="tvJudges">
            <div class="waiting-text">HỆ THỐNG ĐANG GHI NHẬN ĐIỂM SỐ...</div>
        </div>

        <div class="total-container" id="tvTotalBox">
            <div class="total-title">TỔNG ĐIỂM CHÍNH THỨC</div>
            <div class="total-score" id="tvTotalScore">0.00</div>
        </div>
    </div>

    <script>
        var socket = io();

        // KHI ADMIN BẤM "CHỐT & TRÌNH CHIẾU TIVI"
        socket.on('quyen_tv_animate', function(data) {
            document.getElementById('tvName').innerText = data.name;
            document.getElementById('tvUnit').innerText = data.unit;
            
            let container = document.getElementById('tvJudges');
            let totalBox = document.getElementById('tvTotalBox');
            
            // Ẩn tổng điểm đi để làm hiệu ứng
            totalBox.classList.remove('show-total');
            container.innerHTML = ''; // Xóa chữ Waiting
            
            let result = data.result;

            // BƯỚC 1: Hiện bảng điểm 5 Giám định lên (màu trắng, chưa loại ai)
            result.scores.forEach(s => {
                let box = document.createElement('div');
                box.className = 'judge-box';
                box.id = 'tv_j_' + s.id;
                box.innerHTML = `<div class="j-title">GĐ ${s.id}</div><div class="j-score">${s.val}</div>`;
                container.appendChild(box);
            });

            // BƯỚC 2: Hiệu ứng sau 1.5 giây (Làm mờ Cao/Thấp, Sáng 3 điểm giữ lại)
            setTimeout(() => {
                result.scores.forEach(s => {
                    let box = document.getElementById('tv_j_' + s.id);
                    if(result.dropped.includes(s.id)) {
                        box.classList.add('dimmed'); // Làm mờ Cao nhất, Thấp nhất
                    } else {
                        box.classList.add('highlighted'); // Làm rực sáng 3 điểm giữ lại
                    }
                });

                // BƯỚC 3: Hiệu ứng sau 1 giây nữa (Hiện Tổng điểm khổng lồ lên)
                setTimeout(() => {
                    document.getElementById('tvTotalScore').innerText = result.total;
                    totalBox.classList.add('show-total');
                }, 1000);

            }, 1500);
        });

        // KHI ADMIN RESET TRẬN MỚI
        socket.on('quyen_unlock_judges', function() {
            document.getElementById('tvName').innerText = "ĐANG CHỜ VẬN ĐỘNG VIÊN...";
            document.getElementById('tvUnit').innerText = "---";
            document.getElementById('tvJudges').innerHTML = '<div class="waiting-text">HỆ THỐNG ĐANG GHI NHẬN ĐIỂM SỐ...</div>';
            document.getElementById('tvTotalBox').classList.remove('show-total');
        });
    </script>
</body>
</html>
