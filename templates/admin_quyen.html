<!-- CỤM ĐIỀU KHIỂN CỦA ADMIN -->
<div class="control-bar" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
    <select id="catSelect" onchange="syncToJudges()" style="background: #333; color: white;">
        <option value="DON_LUYEN">Đơn Luyện</option>
        <option value="SONG_LUYEN">Song Luyện</option>
        <option value="DONG_DOI">Đồng Đội</option>
        <option value="DA_LUYEN">Đa Luyện</option>
        <option value="TU_VE_NU">Tự Vệ Nữ</option>
    </select>
    
    <div style="display: flex; align-items: center; gap: 5px; background: #333; padding: 5px 15px; border-radius: 5px;">
        <span style="font-weight: bold; color: #aaa;">Điểm Chuẩn:</span>
        <input type="number" id="adminMaxScore" value="100" onchange="syncToJudges()" style="width: 60px; text-align: center; font-weight: bold; padding: 5px;">
    </div>
    
    <button onclick="resetScores()" style="background: #cc0000; color: white;">🔄 MỞ TRẬN MỚI (Mở khóa GĐ)</button>
    <button onclick="saveResult()" style="background: #0066cc; color: white;">💾 LƯU LÊN SHEET</button>
    
    <!-- NÚT QUYỀN LỰC: CHỐT & CHIẾU TIVI -->
    <button onclick="lockAndShowTV()" style="background: #ff00ff; color: white; border: 2px solid white; box-shadow: 0 0 10px #ff00ff;">📺 CHỐT & CHIẾU TIVI</button>
</div>
