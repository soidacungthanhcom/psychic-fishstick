<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ADMIN CHẤM QUYỀN V8.5 (TỰ ĐỘNG MỞ TRẬN)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .control-bar { margin-bottom: 20px; background: #333; padding: 15px; border-radius: 10px; display: flex; justify-content: center; gap: 15px; align-items: center; flex-wrap: wrap;}
        .scores-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .judge-box { background: #111; border: 2px solid #555; border-radius: 10px; width: 180px; padding: 15px; position: relative; }
        .judge-title { color: #00ffcc; font-weight: bold; }
        .judge-score { font-size: 3em; font-weight: bold; color: yellow; }
        .judge-details { font-size: 0.85em; color: #aaa; font-style: italic; min-height: 45px; border-top: 1px solid #333; margin-top: 10px; padding-top: 5px; }
        .dropped { text-decoration: line-through; color: #ff4d4d !important; opacity: 0.4; }
        .box-dropped { border-color: #ff4d4d; }
        
        .dashboard { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .total-area { background: #000; padding: 20px; border-radius: 20px; border: 4px solid #0066cc; width: 350px;}
        .total-score { font-size: 5.5em; font-weight: bold; color: #fff; line-height: 1.2; }
        
        .stopwatch-area { background: #000; padding: 20px; border-radius: 20px; border: 4px solid #ff9900; width: 350px;}
        .stopwatch-display { font-size: 5.5em; font-weight: bold; color: yellow; font-family: monospace; line-height: 1.2; }
        
        button, select, input { padding: 10px 20px; font-size: 1.1em; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        
        /* GIAO DIỆN MODAL QUẢN LÝ TIÊU CHÍ */
        #criteriaModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; }
        .modal-content { background:#222; border:2px solid #ff9900; border-radius:10px; padding:20px; width:90%; max-width:800px; max-height:90vh; overflow-y:auto; text-align: left;}
        .crit-table { width:100%; border-collapse: collapse; margin-bottom: 20px; }
        .crit-table th, .crit-table td { padding:10px; border:1px solid #555; text-align: center; }
        .crit-table th { background:#333; color:#fff; }
    </style>
</head>
<body>

    <div class="control-bar" style="background: #222; border: 2px solid #555;">
        <button onclick="loadList()" style="background: #ff9900; color: #000;">📥 TẢI DS QUYỀN</button>
        <select id="athleteSelect" style="width: 350px; background: #fff; color: #000;">
            <option value="">-- Chọn Vận động viên tiếp theo --</option>
        </select>
        <span id="athleteInfo" style="color: #00ffcc; font-weight: bold; font-size: 1.2em; min-width: 200px;"></span>
        <a href="/viewer_quyen" target="_blank" style="color:yellow; margin-left: 10px; font-weight: bold; text-decoration: none; border: 1px solid yellow; padding: 10px; border-radius: 5px;">📺 MỞ TIVI QUYỀN</a>
    </div>

    <!-- CỤM ĐIỀU KHIỂN CỦA ADMIN -->
    <div class="control-bar">
        <select id="catSelect" onchange="syncToJudges()" style="background: #444; color: white;">
            <option value="DON_LUYEN">Đơn Luyện</option>
            <option value="SONG_LUYEN">Song Luyện</option>
            <option value="DONG_DOI">Đồng Đội</option>
            <option value="DA_LUYEN">Đa Luyện</option>
            <option value="TU_VE_NU">Tự Vệ Nữ</option>
        </select>
        
        <div style="display: flex; align-items: center; gap: 5px; background: #333; padding: 5px 15px; border-radius: 5px;">
            <span style="font-weight: bold; color: #aaa;">Điểm Chuẩn:</span>
            <input type="number" id="adminMaxScore" value="100" onchange="syncToJudges()" style="width: 70px; text-align: center; font-weight: bold; padding: 5px; border-radius: 5px; background: #222; color: white;">
        </div>
        
        <!-- NÚT MỞ BẢNG TÙY CHỈNH TIÊU CHÍ -->
        <button onclick="openCriteriaModal()" style="background: #fff; color: #000; box-shadow: 0 0 10px #fff;">⚙️ QUẢN LÝ TIÊU CHÍ</button>

        <button onclick="saveResult()" style="background: #0066cc; color: white;">💾 LƯU LÊN SHEET</button>
        <button onclick="lockAndShowTV()" style="background: #ff00ff; color: white; box-shadow: 0 0 10px #ff00ff;">📺 CHỐT & CHIẾU TIVI</button>
    </div>

    <div class="scores-container" id="scoresBoard"></div>

    <div class="dashboard">
        <div class="stopwatch-area">
            <div style="color: #ff9900; font-weight: bold; font-size: 1.2em;">⏱ THỜI GIAN BÀI THI</div>
            <div class="stopwatch-display" id="stopwatchDisplay">00:00.00</div>
            <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
                <button id="btnStartTimer" onclick="toggleStopwatch()" style="background: #28a745; color: white; width: 140px;">▶ BẮT ĐẦU</button>
                <button onclick="resetStopwatch()" style="background: #555; color: white;">🔄 ĐẶT LẠI</button>
            </div>
        </div>

        <div class="total-area">
            <div style="color: #0066cc; font-weight: bold; font-size: 1.2em;">TỔNG ĐIỂM CUỐI CÙNG</div>
            <div class="total-score" id="totalScore">0.00</div>
        </div>
    </div>

    <!-- MODAL QUẢN LÝ LUẬT THI ĐẤU -->
    <div id="criteriaModal">
        <div class="modal-content">
            <h2 style="color:#ffcc00; margin-top:0;">⚙️ TÙY CHỈNH TIÊU CHÍ CHẤM ĐIỂM</h2>
            <h3 style="color:#00ffcc; border-bottom: 1px solid #555; padding-bottom: 10px;" id="modalCatName"></h3>
            
            <table class="crit-table">
                <thead><tr><th style="text-align: left;">Tên Lỗi (Tiêu chí)</th><th>Điểm trừ</th><th>Loại nút bấm</th><th>Hành động</th></tr></thead>
                <tbody id="criteriaTableBody"></tbody>
            </table>
            
            <div style="background:#111; padding:15px; border-radius:8px; border:1px dashed #555; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <input type="text" id="newCritLabel" placeholder="Nhập tên lỗi (Vd: Rớt vũ khí, Đi sai thảm...)" style="flex:2; background:#333; color:#fff; border:1px solid #555; padding:10px;">
                <input type="number" id="newCritVal" placeholder="-2" value="-2" style="flex:0.5; background:#333; color:#fff; border:1px solid #555; padding:10px; text-align:center;">
                <select id="newCritType" style="flex:1; background:#333; color:#fff; border:1px solid #555; padding:10px;">
                    <option value="multi">🔴 Trừ nhiều lần (Có đếm số)</option>
                    <option value="single">⭐ Trừ 1 lần (Công tắc Bật/Tắt)</option>
                </select>
                <button onclick="addCriteria()" style="background:#28a745; color:white; padding:10px 15px;">➕ THÊM LỖI</button>
            </div>
            
            <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:15px;">
                <button onclick="closeCriteriaModal()" style="background:#555; color:white;">❌ HỦY BỎ</button>
                <button onclick="saveAndSyncCriteria()" style="background:#0066cc; color:white; font-size: 1.2em; box-shadow: 0 0 10px #0066cc;">💾 LƯU LẠI & ĐỒNG BỘ CHO GIÁM ĐỊNH</button>
            </div>
        </div>
    </div>

    <script>
        var socket = io();
        var lastData = null;
        var currentAthlete = {}; 

        // BỘ DỮ LIỆU LUẬT THI ĐẤU
        const criteriaData = {
            'DON_LUYEN': [{ id: 'dl_m1', label: 'Sai động tác', val: -1, type: 'multi' }, { id: 'dl_m2', label: 'Ngập ngừng', val: -2, type: 'multi' }, { id: 'dl_m3', label: 'Bỏ đ.tác / Sai nặng', val: -5, type: 'multi' }, { id: 'dl_m4', label: 'Tấn sai kỹ thuật', val: -1, type: 'multi' }, { id: 'dl_m5', label: 'Mất thăng bằng', val: -2, type: 'multi' }, { id: 'dl_s1', label: 'Sai vị trí kết thúc', val: -2, type: 'single' }, { id: 'dl_s2', label: 'VK chạm nhẹ', val: -2, type: 'single' }, { id: 'dl_s3', label: 'VK chạm nặng', val: -5, type: 'single' }, { id: 'dl_s4', label: 'Quyền, cước chậm', val: -2, type: 'single' }, { id: 'dl_s5', label: 'Thiếu uy lực', val: -2, type: 'single' }, { id: 'dl_s6', label: 'Biểu lộ mệt mỏi', val: -2, type: 'single' }, { id: 'dl_s7', label: 'Quá thời gian quy định', val: -2, type: 'single' }, { id: 'dl_s8', label: 'Thiếu uyển chuyển', val: -2, type: 'single' }, { id: 'dl_s9', label: 'Thiếu ấn tượng', val: -1, type: 'single' }],
            'SONG_LUYEN': [{ id: 'sl_m1', label: 'Sai động tác', val: -1, type: 'multi' }, { id: 'sl_m2', label: 'Ngập ngừng', val: -2, type: 'multi' }, { id: 'sl_m3', label: 'Bỏ đ.tác / Sai nặng', val: -5, type: 'multi' }, { id: 'sl_m4', label: 'Ra khỏi vạch', val: -1, type: 'multi' }, { id: 'sl_s1', label: 'VK chạm nhẹ', val: -2, type: 'single' }, { id: 'sl_s2', label: 'VK chạm nặng', val: -5, type: 'single' }, { id: 'sl_s3', label: 'Xiết/Phản đòn ko rõ', val: -2, type: 'single' }, { id: 'sl_s4', label: 'Ngã không an toàn', val: -2, type: 'single' }, { id: 'sl_s5', label: 'Thiếu nhịp nhàng', val: -1, type: 'single' }, { id: 'sl_s6', label: 'Quyền, cước chậm', val: -2, type: 'single' }, { id: 'sl_s7', label: 'Thiếu uy lực', val: -2, type: 'single' }, { id: 'sl_s8', label: 'Biểu lộ mệt mỏi', val: -2, type: 'single' }, { id: 'sl_s9', label: 'Chậm 5s quy định', val: -2, type: 'single' }, { id: 'sl_s10', label: 'Thiếu ấn tượng', val: -1, type: 'single' }],
            'DONG_DOI': [{ id: 'dd_m1', label: 'Sai động tác', val: -1, type: 'multi' }, { id: 'dd_m2', label: 'Bỏ đ.tác / Sai nặng', val: -5, type: 'multi' }, { id: 'dd_m3', label: 'Tấn sai kỹ thuật', val: -1, type: 'multi' }, { id: 'dd_m4', label: 'Mất thăng bằng', val: -2, type: 'multi' }, { id: 'dd_m5', label: 'Không đồng đều', val: -2, type: 'multi' }, { id: 'dd_s1', label: 'Sai vị trí kết thúc', val: -2, type: 'single' }, { id: 'dd_s2', label: 'Quyền, cước chậm', val: -2, type: 'single' }, { id: 'dd_s3', label: 'Thiếu uy lực', val: -2, type: 'single' }, { id: 'dd_s4', label: 'Biểu lộ mệt mỏi', val: -2, type: 'single' }, { id: 'dd_s5', label: 'Thiếu ấn tượng', val: -1, type: 'single' }],
            'DA_LUYEN': [{ id: 'dal_m1', label: 'Ngập ngừng', val: -2, type: 'multi' }, { id: 'dal_m2', label: 'Ra khỏi vạch', val: -1, type: 'multi' }, { id: 'dal_s1', label: 'Cấu trúc/Tấn công kém', val: -2, type: 'single' }, { id: 'dal_s2', label: 'Không liên tục', val: -2, type: 'single' }, { id: 'dal_s3', label: 'Chấn thương/Quên bài', val: -10, type: 'single' }, { id: 'dal_s4', label: 'Thiếu 1 đòn cơ bản', val: -3, type: 'single' }, { id: 'dal_s5', label: 'Phản đòn chậm yếu', val: -2, type: 'single' }, { id: 'dal_s6', label: 'Phối hợp không tốt', val: -2, type: 'single' }, { id: 'dal_s7', label: 'Thể lực không tốt', val: -2, type: 'single' }, { id: 'dal_s8', label: 'Xiết/Phản đòn ko rõ', val: -2, type: 'single' }, { id: 'dal_s9', label: 'Ngã không an toàn', val: -2, type: 'single' }, { id: 'dal_s10', label: 'Không nhịp nhàng', val: -2, type: 'single' }, { id: 'dal_s11', label: 'Thiếu ấn tượng', val: -2, type: 'single' }],
            'TU_VE_NU': [{ id: 'tv_m1', label: 'Ngập ngừng', val: -2, type: 'multi' }, { id: 'tv_m2', label: 'Ra khỏi vạch', val: -1, type: 'multi' }, { id: 'tv_s1', label: 'Cấu trúc/Tấn công kém', val: -2, type: 'single' }, { id: 'tv_s2', label: 'Không liên tục', val: -2, type: 'single' }, { id: 'tv_s3', label: 'Diễu cợt/Ko nghiêm túc', val: -2, type: 'single' }, { id: 'tv_s4', label: 'Thiếu 1 đòn cơ bản', val: -3, type: 'single' }, { id: 'tv_s5', label: 'Quyền cước thiếu uy lực', val: -2, type: 'single' }, { id: 'tv_s6', label: 'Tránh né chậm', val: -2, type: 'single' }, { id: 'tv_s7', label: 'Thể lực không tốt', val: -2, type: 'single' }, { id: 'tv_s8', label: 'Xiết/Phản đòn ko rõ', val: -2, type: 'single' }, { id: 'tv_s9', label: 'Ngã không an toàn', val: -2, type: 'single' }, { id: 'tv_s10', label: 'Thiếu nhịp nhàng', val: -2, type: 'single' }, { id: 'tv_s11', label: 'Thiếu ấn tượng', val: -2, type: 'single' }]
        };

        // --- CÁC HÀM XỬ LÝ GIAO DIỆN TÙY CHỈNH LUẬT ---
        function openCriteriaModal() { let catSelect = document.getElementById('catSelect'); document.getElementById('modalCatName').innerText = "Đang chỉnh sửa luật thi: " + catSelect.options[catSelect.selectedIndex].text; renderCriteriaTable(); document.getElementById('criteriaModal').style.display = 'flex'; }
        function closeCriteriaModal() { document.getElementById('criteriaModal').style.display = 'none'; }
        function renderCriteriaTable() { let tbody = document.getElementById('criteriaTableBody'); let cat = document.getElementById('catSelect').value; tbody.innerHTML = ''; criteriaData[cat].forEach((item, index) => { let typeText = item.type === 'multi' ? '<span style="color:#ff6666; font-weight:bold;">🔴 Trừ nhiều lần</span>' : '<span style="color:#ffcc00; font-weight:bold;">⭐ Trừ 1 lần</span>'; tbody.innerHTML += `<tr style="border-bottom:1px solid #444;"><td style="text-align:left;">${item.label}</td><td style="color:#ff4d4d; font-weight:bold; font-size:1.2em;">${item.val}</td><td>${typeText}</td><td><button onclick="deleteCriteria(${index})" style="background:#cc0000; color:white; padding:5px 10px; font-size:0.9em;">XÓA LỖI</button></td></tr>`; }); }
        function addCriteria() { let cat = document.getElementById('catSelect').value; let label = document.getElementById('newCritLabel').value.trim(); let val = parseInt(document.getElementById('newCritVal').value); let type = document.getElementById('newCritType').value; if(!label) return alert("Vui lòng nhập tên lỗi!"); if(val >= 0) return alert("Điểm trừ phải là số âm (vd: -2, -5)!"); let newId = 'custom_' + Date.now(); criteriaData[cat].push({ id: newId, label: label, val: val, type: type }); renderCriteriaTable(); document.getElementById('newCritLabel').value = ''; }
        function deleteCriteria(index) { if(confirm("Bạn có chắc chắn muốn xóa lỗi này khỏi luật chấm điểm?")) { let cat = document.getElementById('catSelect').value; criteriaData[cat].splice(index, 1); renderCriteriaTable(); } }
        function saveAndSyncCriteria() { syncToJudges(); closeCriteriaModal(); alert("✅ Đã LƯU & ÉP toàn bộ Giám định sử dụng Bộ tiêu chí mới này!"); }
        
        function syncToJudges() {
            let cat = document.getElementById('catSelect').value;
            let max = document.getElementById('adminMaxScore').value;
            let currentCrit = criteriaData[cat]; 
            socket.emit('quyen_admin_sync', { category: cat, maxScore: max, criteria: currentCrit });
        }

        // ==========================================
        // CÁC HÀM HOẠT ĐỘNG CHÍNH 
        // ==========================================
        let swInterval; let swStartTime; let swElapsedTime = 0; let swIsRunning = false;
        function toggleStopwatch() {
            let btn = document.getElementById('btnStartTimer');
            if(swIsRunning) { clearInterval(swInterval); swIsRunning = false; btn.innerText = "▶ TIẾP TỤC"; btn.style.background = "#28a745";
            } else { swStartTime = Date.now() - swElapsedTime; swInterval = setInterval(updateStopwatch, 10); swIsRunning = true; btn.innerText = "⏸ DỪNG LẠI"; btn.style.background = "#cc0000"; }
        }
        function updateStopwatch() {
            swElapsedTime = Date.now() - swStartTime; let totalMs = swElapsedTime;
            let ms = Math.floor((totalMs % 1000) / 10); let s = Math.floor((totalMs / 1000) % 60); let m = Math.floor(totalMs / 60000);
            document.getElementById('stopwatchDisplay').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }
        function resetStopwatch() { clearInterval(swInterval); swIsRunning = false; swElapsedTime = 0; document.getElementById('stopwatchDisplay').innerText = "00:00.00"; let btn = document.getElementById('btnStartTimer'); btn.innerText = "▶ BẮT ĐẦU"; btn.style.background = "#28a745"; }

        function loadList() {
            let btn = document.querySelector("button[onclick='loadList()']");
            let oldText = btn.innerText; btn.innerText = "⏳...";
            fetch('/get_match_list?type=QUYEN').then(r => r.json()).then(data => {
                btn.innerText = oldText; let sel = document.getElementById('athleteSelect');
                sel.innerHTML = '<option value="">-- Chọn Vận động viên tiếp theo --</option>';
                data.forEach(item => { sel.innerHTML += `<option value='${JSON.stringify(item)}'>${item.id} - ${item.name} (${item.unit}) - ${item.category}</option>`; });
            }).catch(e => { btn.innerText = oldText; alert("Lỗi kết nối!"); });
        }

        // --- CƠ CHẾ CHỌN VĐV TỰ ĐỘNG RESET TRẬN MỚI ---
        document.getElementById('athleteSelect').addEventListener('change', function() {
            if(this.value) { 
                currentAthlete = JSON.parse(this.value); 
                document.getElementById('athleteInfo').innerText = `Đang thi: ${currentAthlete.name} | ${currentAthlete.category}`; 
                
                // Tự động xóa điểm cũ, reset đồng hồ và MỞ KHÓA Giám định
                socket.emit('reset_scores'); 
                resetStopwatch();
                
                // Cảnh báo nhẹ nếu chọn sai nội dung thi đấu
                let catSelect = document.getElementById('catSelect');
                if(catSelect.value !== currentAthlete.category) {
                    alert(`⚠️ VĐV này thi nội dung ${currentAthlete.category}, vui lòng chọn lại đúng Nội dung và bấm 'LƯU & ĐỒNG BỘ' ở phần Quản lý tiêu chí nếu cần!`);
                }
            } else { 
                currentAthlete = {}; 
                document.getElementById('athleteInfo').innerText = ""; 
            }
        });

        socket.on('update_board', function(data) {
            lastData = data; let container = document.getElementById('scoresBoard'); container.innerHTML = '';
            data.scores.forEach(s => {
                let isDropped = data.dropped.includes(s.id);
                container.innerHTML += `<div class="judge-box ${isDropped ? 'box-dropped' : ''}"><div class="judge-title">GIÁM ĐỊNH ${s.id}</div><div class="judge-score ${isDropped ? 'dropped' : ''}">${s.val || '-'}</div><div class="judge-details">${s.details || 'Chờ chấm...'}</div></div>`;
            });
            document.getElementById('totalScore').innerText = data.total;
        });

        function saveResult() {
            if(!currentAthlete.id) { alert("⚠️ Chọn VĐV trước khi lưu!"); return; }
            if(!lastData || lastData.total === "Waiting...") { alert("⚠️ Giám định chưa chấm xong!"); return; }
            if(swIsRunning) toggleStopwatch();
            
            let timeString = document.getElementById('stopwatchDisplay').innerText;
            let finalDetails = `[Thời gian bài thi: ${timeString}] || ` + lastData.scores.map(s => `GĐ${s.id}: ${s.val} (${s.details})`).join(" || ");

            if(confirm(`Bạn có chắc chắn lưu [ ${lastData.total} điểm ] và Thời gian [ ${timeString} ] cho VĐV [ ${currentAthlete.name} ]?`)) {
                fetch('/save_to_sheet', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: 'QUYEN', matchId: currentAthlete.id, name: currentAthlete.name, total: lastData.total, details: finalDetails })
                }).then(r => r.json()).then(d => {
                    if(d.status === 'success' || d.result === 'success') alert("✅ Đã lưu thành công vào tab KQ_Quyen!");
                    else alert("❌ Có lỗi xảy ra khi lưu!");
                }).catch(e => alert("❌ Lỗi mạng hoặc server!"));
            }
        }

        function lockAndShowTV() {
            if(!lastData || lastData.total === "Waiting...") { alert("⚠️ Giám định chưa chấm xong!"); return; }
            if(swIsRunning) toggleStopwatch();
            let athleteName = currentAthlete.name ? currentAthlete.name : "VẬN ĐỘNG VIÊN";
            let athleteUnit = currentAthlete.unit ? currentAthlete.unit : "---";
            socket.emit('quyen_lock_and_show_tv', { name: athleteName, unit: athleteUnit, result: lastData });
        }
        
        // Gọi lệnh Sync lần đầu để load sẵn bộ luật Đơn Luyện mặc định
        setTimeout(syncToJudges, 1000); 
    </script>
</body>
</html>
